<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-labelledby="title desc">
  <title id="title">Bolt-trimmed sword recipe</title>
  <desc id="desc">A smithing table takes a Bolt trim template, a sword, and a trim material to make a trimmed sword.</desc>
  <rect width="900" height="330" rx="20" fill="#202938"/>
  <text x="42" y="48" fill="#f5f7fa" font-family="sans-serif" font-size="25" font-weight="700">SMITHING TABLE</text>
  <g font-family="sans-serif" text-anchor="middle">
    <rect x="40" y="82" width="170" height="150" rx="14" fill="#313f53"/>
    <text x="125" y="137" fill="#f4c95d" font-size="19" font-weight="700">TEMPLATE</text>
    <text x="125" y="177" fill="#f5f7fa" font-size="18">Bolt trim</text>
    <text x="125" y="203" fill="#c5cfdd" font-size="14">pattern</text>
    <text x="250" y="172" fill="#c5cfdd" font-size="38">+</text>
    <rect x="290" y="82" width="170" height="150" rx="14" fill="#313f53"/>
    <text x="375" y="137" fill="#f4c95d" font-size="19" font-weight="700">TOOL</text>
    <text x="375" y="177" fill="#f5f7fa" font-size="18">Sword</text>
    <text x="500" y="172" fill="#c5cfdd" font-size="38">+</text>
    <rect x="540" y="82" width="170" height="150" rx="14" fill="#313f53"/>
    <text x="625" y="137" fill="#f4c95d" font-size="19" font-weight="700">MATERIAL</text>
    <text x="625" y="177" fill="#f5f7fa" font-size="18">Any trim</text>
    <text x="625" y="203" fill="#c5cfdd" font-size="14">material</text>
    <text x="754" y="170" fill="#aebbd0" font-size="34">→</text>
    <rect x="780" y="82" width="90" height="150" rx="14" fill="#344e46"/>
    <text x="825" y="137" fill="#9be2b5" font-size="16" font-weight="700">RESULT</text>
    <text x="825" y="177" fill="#f5f7fa" font-size="15">Trimmed</text>
    <text x="825" y="201" fill="#f5f7fa" font-size="15">sword</text>
  </g>
  <text x="450" y="285" fill="#c5cfdd" font-family="sans-serif" font-size="17" text-anchor="middle">Choose the trim color with the material you place in the final ingredient slot.</text>
</svg>
